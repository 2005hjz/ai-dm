<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI-DM · D&D 5e 单人 TRPG 智能主持</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <!-- 左侧聊天区 -->
  <main class="chat">
    <header class="chat-head">
      <div>
        <h1 id="session-title">《风铃镇·灰烬墓穴》</h1>
        <p class="sub" id="session-meta">连接引擎中…</p>
      </div>
      <div class="badges">
        <span class="badge" id="llm-badge">Mock DM</span>
        <span class="badge" id="img-badge">本地生图</span>
      </div>
    </header>
    <div id="messages" class="messages"></div>
    <form id="send-form" class="sendbar" autocomplete="off">
      <span class="prompt">▍</span>
      <input id="input" type="text" placeholder="描述行动如「我检查铺门口的悬赏」｜先 /char 1 创建角色｜/check 感知 DC｜/roll /inv /hp /sell /rest｜/help" />
      <button id="send" type="submit">发送</button>
    </form>
  </main>

  <!-- 右侧状态栏 -->
  <aside class="panel">
    <section class="new-game">
      <input id="player-name" type="text" placeholder="你的调查员名字" />
      <button id="btn-new" type="button">开始新冒险</button>
    </section>

    <section class="card scene-card">
      <h2>当前场景</h2>
      <img id="scene-img" alt="场景卡" />
      <p id="scene-name" class="dim">—</p>
    </section>

    <section class="card sheet">
      <h2>角色卡 · D&D 5e</h2>
      <p id="player-name-display">无名冒险者</p>
      <p class="mini" id="char-line">—</p>
      <div class="hp" id="hp-bar"></div>
      <p class="mini" id="xp-line">—</p>
      <p class="mini" id="gp-line">—</p>
      <div id="abil-list"></div>
    </section>

    <section class="card">
      <h2>背包与法术</h2>
      <div id="inv-list"></div>
      <p class="mini" id="spell-line">法术:无</p>
    </section>

    <section class="card">
      <h2>数值与统计</h2>
      <div class="stat-grid">
        <div class="stat"><b id="stat-rolls">0</b><span>掷骰</span></div>
        <div class="stat"><b id="stat-checks">0</b><span>检定</span></div>
        <div class="stat ok"><b id="stat-pass">0</b><span>成功</span></div>
        <div class="stat bad"><b id="stat-fail">0</b><span>失败</span></div>
      </div>
    </section>

    <section class="card">
      <h2>NPC 角色卡</h2>
      <div id="npc-list"></div>
    </section>

    <section class="card">
      <h2>冒险日志</h2>
      <ul id="event-log"></ul>
    </section>

    <section class="card">
      <h2>
        剧情分支树
        <button id="btn-branches" type="button" class="mini-btn" title="刷新分支树">刷新</button>
      </h2>
      <div id="branch-tree" class="branch-tree"><p class="dim">加载中…</p></div>
    </section>
  </aside>
</div>
<script src="/static/app.js"></script>
</body>
</html>
