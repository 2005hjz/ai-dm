[project]
name = "ai-dm-engine"
version = "1.0.0"
description = "AI 赛博 DM 与无限跑团/剧本杀引擎 (AI-DM & Immersive RPG Engine)"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "data", ".github", "docs", "static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]